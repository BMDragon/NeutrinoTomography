[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nutomo"
version = "0.1.0"
description = "Earth tomography with atmospheric neutrinos on a laterally heterogeneous tesseroid grid"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pyyaml>=6",
    "nuoscprobexact>=1.13,<2",
    "numba",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "h5py"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
